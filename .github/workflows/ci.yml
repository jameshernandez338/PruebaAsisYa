name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore
        run: dotnet restore PruebaAsisYa.slnx

      - name: Build
        run: dotnet build PruebaAsisYa.slnx --configuration Release --no-restore

      - name: Tests
        run: dotnet test PruebaAsisYa.slnx --configuration Release --no-build