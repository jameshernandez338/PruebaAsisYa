version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Your_password123 -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10

  providerapi:
    build:
      context: ./ProviderService/Provider.Api
      dockerfile: Dockerfile
    depends_on:
      - sqlserver
    environment:
      - CONN=Server=sqlserver,1433;Database=ProvidersDb;User Id=sa;Password=Your_password123;
    ports:
      - "5002:80"
